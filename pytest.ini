[pytest]
testpaths = tests
pythonpath = src
addopts = -m "not slow"
markers =
    slow: uses the real IBM AMLworld files in shared/data/aml (skipped when missing; run with -m slow)
filterwarnings =
    # numpy 2.0 + macOS Accelerate raises spurious FP-flag warnings in small float32 matmuls; the results
    # are checked numerically against torch in test_models.py, so the warnings are noise here.
    ignore:.*encountered in matmul:RuntimeWarning
    # starlette's TestClient warns that it will move to httpx2; not our code
    ignore:Using `httpx` with `starlette.testclient`
